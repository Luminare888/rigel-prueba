<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas Celeste del Explorador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@1&display=swap" rel="stylesheet">
<style>
:root{--noche:#070b17;--noche2:#0e1530;--oro:#c9a45c;--oro-claro:#ecd496;--marfil:#efe3c2;--tinta:#2b2118;--rojo:#8c3a3a;
--serif:'Cinzel',Georgia,'Times New Roman',serif;--texto:'Crimson Pro',Georgia,serif;--mano:'IM Fell English',Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--noche);color:var(--marfil);font-family:var(--texto)}
body{background:radial-gradient(ellipse at 50% 45%,#16214a 0%,var(--noche2) 45%,var(--noche) 100%)}
#map{position:fixed;inset:0;width:100%;height:100%;display:block}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}
.star{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.orbit{transform-origin:center;transform-box:fill-box;animation:spin 240s linear infinite}
.orbit.rev{animation-duration:360s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.halo{animation:pulse 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
.con line{stroke:var(--oro);stroke-width:1;opacity:.35;transition:opacity .6s,stroke-width .6s}
.con circle{fill:var(--oro-claro);opacity:.6;transition:opacity .6s}
.con.lit line{opacity:1;stroke-width:1.6;filter:drop-shadow(0 0 4px var(--oro))}
.con.lit circle{opacity:1}
.astro{cursor:pointer;outline:none}
.astro .core{fill:var(--oro-claro);stroke:var(--oro);stroke-width:1.2;transition:filter .4s,fill .4s}
.astro.unk .core{fill:#3a3f55;stroke:#6b6f85}
.astro .ring{fill:none;stroke:var(--oro-claro);stroke-width:1.4;opacity:0;transition:opacity .4s}
.astro:hover .core,.astro.active .core{filter:drop-shadow(0 0 8px #ffe9a8) drop-shadow(0 0 16px var(--oro))}
.astro:hover .ring,.astro:focus-visible .ring,.astro.active .ring{opacity:1}
.astro:focus-visible .ring{stroke-width:2.5;stroke:#fff}
.lbl{font-family:var(--serif);font-size:13px;letter-spacing:.12em;fill:var(--oro-claro);opacity:0;transition:opacity .4s;pointer-events:none;paint-order:stroke;stroke:#050810;stroke-width:3px}
.astro:hover .lbl,.astro:focus-visible .lbl,.astro.active .lbl{opacity:1}
@media (hover:none){.lbl{opacity:.8;font-size:11px}}
.deco-t{font-family:var(--serif);fill:var(--oro);letter-spacing:.2em;pointer-events:none}
.deco-m{font-family:var(--mano);font-style:italic;fill:var(--marfil);opacity:.8;pointer-events:none}
#hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);font-family:var(--mano);font-style:italic;color:var(--oro-claro);opacity:.85;transition:opacity 1s;pointer-events:none;text-align:center;padding:0 12px;text-shadow:0 0 8px #000}
#hint.off{opacity:0}
/* pergamino */
#veil{position:fixed;inset:0;display:none;background:transparent}
#veil.on{display:block}
#scroll{position:fixed;top:50%;width:min(440px,92vw);max-height:84vh;overflow:auto;color:var(--tinta);padding:30px 30px 26px;border-radius:6px;
background:radial-gradient(ellipse at 20% 10%,rgba(255,250,225,.7),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(140,90,40,.35),transparent 60%),
url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .28  0 0 0 0 .12  0 0 0 .22 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>"),#e6d6a8;
box-shadow:0 0 0 1px #6e5528,0 0 0 6px #e6d6a8,0 0 0 7px #8a6d3b,0 25px 60px rgba(0,0,0,.75),inset 0 0 50px rgba(110,70,20,.45);
opacity:0;visibility:hidden;transform:translateY(-46%) scale(.94);transition:opacity .6s ease,transform .6s ease,visibility 0s .6s}
#scroll.right{right:4vw}#scroll.left{left:4vw}
#scroll.open{opacity:1;visibility:visible;transform:translateY(-50%) scale(1);transition:opacity .6s ease,transform .6s ease}
#scroll h2{font-family:var(--serif);margin:0 28px 2px 0;font-size:1.45rem;color:#4a1c25;letter-spacing:.06em}
#scroll .sub{font-family:var(--mano);font-style:italic;color:#6a5030;margin:0 0 14px}
#scroll hr{border:0;height:1px;background:linear-gradient(90deg,transparent,#8a6d3b,transparent);margin:0 0 14px}
#scroll dl{margin:0}
#scroll dt{font-family:var(--serif);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--rojo);margin-top:12px}
#scroll dd{margin:3px 0 0;font-size:1.12rem;line-height:1.5}
#scroll .edit{font-size:.8rem;color:#7a6440;font-style:italic;margin-top:16px}
#scroll{width:min(480px,92vw)}
#scroll .top{display:flex;gap:16px;align-items:flex-start;margin-bottom:6px}
#scroll .top[hidden]{display:none}
#sPic{margin:0;flex:0 0 160px;height:200px;border:2px solid #6e5528;outline:1px solid #8a6d3b;outline-offset:3px;background:rgba(74,28,37,.08);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--mano);font-style:italic;color:#6a5030;overflow:hidden;box-shadow:inset 0 0 14px rgba(110,70,20,.4)}
#sPic img{width:100%;height:100%;object-fit:cover;filter:sepia(.25)}
#sPic small{font-size:.7rem}
#sFicha dt:first-child{margin-top:0}
#sBody p{margin:0 0 .85em;font-size:1.12rem;line-height:1.5}
#scroll ul{margin:4px 0 0;padding-left:18px}#scroll li{margin-bottom:6px}
.astro.rigel .core{fill:#e4efff;stroke:#a9c4ff}
.astro.rigel .halo{filter:hue-rotate(185deg) saturate(1.3)}
@media (max-width:700px),(orientation:portrait){#sPic{flex-basis:124px;height:156px}}
#close{position:absolute;top:10px;right:12px;width:44px;height:44px;border:0;background:none;color:#4a1c25;font-size:1.7rem;cursor:pointer;border-radius:50%}
#close:hover{background:rgba(74,28,37,.12)}
#close:focus-visible,.astro:focus-visible{outline:2px solid #4a1c25;outline-offset:2px}
@media (max-width:700px),(orientation:portrait){
#scroll{top:auto;bottom:0;left:0!important;right:0!important;width:100%;max-height:56vh;border-radius:14px 14px 0 0;padding:24px 22px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(40px)}
#scroll.open{transform:none}
#hint{bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:.9rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<svg id="map" role="group" aria-label="Mapa astronómico interactivo del explorador. Selecciona un astro para leer su pergamino." xmlns="http://www.w3.org/2000/svg"></svg>
<div class="vig" aria-hidden="true"></div>
<p id="hint">Toca un astro luminoso para desplegar el pergamino…</p>
<div id="veil"></div>
<section id="scroll" role="dialog" aria-modal="false" aria-labelledby="sTitle" aria-hidden="true">
  <button id="close" aria-label="Cerrar pergamino">×</button>
  <h2 id="sTitle"></h2><p class="sub" id="sSub"></p><hr>
  <div class="top" id="sTop" hidden><figure id="sPic"></figure><dl id="sFicha"></dl></div>
  <div id="sBody"></div>
</section>

<script>
/* ================= DATOS EDITABLES =================
   pos  = [x, y] en fracción de pantalla (0-1) en escritorio
   mpos = posición en móvil/vertical
   con  = puntos de la constelación (desplazamiento en unidades de 1% del lado menor)
   secciones = pares {t: título, v: texto} que puedes cambiar libremente */
const ATLAS = { titulo: 'ATLAS DE RIGEL', autor: 'Diario de campo · Jikogisei', cita: '“Mientras sigamos vivos, la verdad estará más cerca.”' };
const ASTROS = [
 {id:'origen', tipo:'rigel', nombre:'Rigel · Estrella del origen', subtitulo:'β Orionis, la estrella más brillante de Orión', pos:[.19,.56], mpos:[.30,.33], size:22, constelacion:'ORIÓN',
  con:[[15,3],[3,-13],[8,-12],[13,-11],[0,-27],[16,-26],[8,-31]],
  lineas:[[0,1],[0,2],[1,4],[2,3],[3,4],[2,5],[4,6],[5,6],[5,7],[6,7]],
  imagen:'https://i.imgur.com/212aVKn.jpeg', /* ← PEGA AQUÍ EL ENLACE DE LA IMAGEN, p. ej. 'https://…/rigel.png' */
  ficha:[{t:'Nombre',v:'Subaraki Rigel'},{t:'Edad',v:'30'},{t:'Lugar de nacimiento',v:'Desconocido'}],
  texto:[`Apariencia: Rigel es un hombre joven de complexión atlética y robusta, con la piel bronceada, una mandíbula marcada y una expresión habitualmente desenfadada. Su cabello es de tono oscuro, ligeramente desordenado y suele llevarlo cayendo de manera informal sobre su frente. En cuanto a su estilo general, prefiere la indumentaria práctica y acorde a la organización, aunque cuando esta "fuera de servicio" prefiere llevar ropa más comoda.`]},
 {id:'pasado', tipo:'luna', nombre:'Luna del pasado', subtitulo:'Trasfondo', pos:[.40,.76], mpos:[.72,.22],
  con:[[-8,-6],[7,-8],[10,5],[-6,8]],
  texto:[
`Rigel pasó sus primeros años junto a su madre, Subaraki Nao, aunque desde muy pequeño mostró interés por las investigaciones de su padre. Cuando apenas tenía tres años, este se vio obligado a separarse de él debido a los peligros que rodeaban sus estudios. Antes de marcharse, confió a Rigel a Ezekiel Veyron, un alto cargo de Jikogisei y ferviente creyente del Credo, bajo el pretexto de que lo convertiría en todo un hombre.`,
`Antes de partir, su padre le entregó sus últimas investigaciones y le prometió que, cuando fuese adulto, volvería para preguntarle qué había conseguido descubrir en ellas.`,
`Rigel creció dentro de Jikogisei, pasando por distintas divisiones y aprendiendo el camino de la organización. Años después fue enviado a Jaya para investigar los rumores sobre las islas del cielo. Durante el viaje decidió desviarse para regresar al lugar donde había pasado su infancia, encontrándose con una verdad que nadie se había molestado en contarle: aquel lugar había desaparecido hacía más de veinte años.`,
`Comprendió entonces que Jikogisei había ocultado deliberadamente su pasado, manteniéndolo alejado de la verdad mediante constantes traslados y falsas misiones. Dolido y enfurecido por el engaño, abandonó su misión y cortó todo contacto con la organización, dedicándose durante años a vagar por el mundo.`,
`Finalmente, decidió retomar las investigaciones de su padre. Tras años intentando descifrar el extraño lenguaje en el que estaban escritas, consiguió comprenderlas y descubrió que contenían un propósito mucho mayor, pero lo más importante, es que en la última página se encontraba una sincera disculpa por lo que había pasado, confirmándole que el mismo sabía que iba morir y le iba a dejar solo.`,
`Cuando el actual líder de Jikogisei volvió a ponerse en contacto con él, Rigel comprendió que había llegado el momento de regresar y terminar aquello que su padre había comenzado.`]},
 {id:'interior', tipo:'constelacion', nombre:'Constelación interior', subtitulo:'Personalidad', pos:[.62,.25], mpos:[.28,.58],
  con:[[-10,4],[-4,-8],[7,-6],[12,3],[3,9]],
  texto:[`A Rigel le encanta animar a sus compañeros, manteniendo siempre una sonrisa en el rostro incluso si la situación no lo acompaña. Es una persona sumamente sociable y de carácter sarcástico, disfrutando de burlarse tanto de sus amigos como de sus enemigos. A pesar de su actitud despreocupada, es alguien disciplinado y extremadamente fiel al código de Jikogisei, siendo capaz de dejar de lado sus propios sentimientos cuando la situación lo requiere. No suele actuar de manera impulsiva y prefiere observar y analizar antes de intervenir, aunque cuando llega el momento de actuar no duda en hacerlo. Fuera de sus objetivos puede ser bastante perezoso, disfrutando de perder el tiempo y observar las estrellas siempre que tiene la oportunidad.`]},
 {id:'diario', tipo:'diario', nombre:'Estrellas del diario', subtitulo:'Curiosidades', pos:[.82,.55], mpos:[.74,.46],
  con:[[-9,-5],[-3,7],[6,-3],[11,6]],
  texto:[
`Al igual que Altair (personaje de la franquicia Assesins Creed), que es la estrella más brillante de la constelación de Aquila, Rigel es una de las estrellas más brillantes de la constelación de Orión. Esto hace referencia a su intención de convertirse en la guía de todo aquel que lo necesite.`,
`Nunca tuvo una buena relación con su padre, pese a que compartía su pasión por el pasado. Consideraba que sus estudios hacían de su madre una persona más desgraciada al permanecer en un segundo plano. Este es el motivo principal por el que porta con orgullo el apellido de su madre, renunciando al de su padre, aunque en la actualidad lo extraña.`,
`Pese a estar enfocado en sus objetivos, adora perder el tiempo observando las estrellas, hacia las que siempre ha sentido cierta pasión.`,
`Siente algo de envidia por aquellos que pueden tener una familia normal y feliz, pues le hubiese encantado que su padre, al igual que el, no se hubiesen centrado tanto en los estudios, y se hubiesen enfocado un poco más en hacer feliz a su madre, aunque fuesen los pocos años que pudieron ser "una familia normal".`,
`Para Rigel, el conocimiento puede llegar a ser una forma de lujuria. No existe secreto que no despierte su deseo por conocerlo, incluso aquellos que deberían permanecer ocultos. Se emociona en exceso con cualquier pista del pasado...`,
`Tiene una especie de gula por las experiencias. Le cuesta rechazar una aventura, un lugar desconocido o cualquier oportunidad de descubrir algo nuevo, pues siente que estaría desperdiciando haber sobrevivido a la masacre.`,
`Conserva con cariño los apuntes de las investigaciones de su padre, siendo su mayor tesoro y aquello que trata de descifrar día a día.`]},
 {id:'errante', tipo:'errante', nombre:'Astro errante', subtitulo:'Objetivos', pos:[.11,.20], mpos:[.20,.78],
  con:[[8,-7],[14,2],[6,9]],
  texto:[
`Conocer todo aquello que se oculta en el mundo, siguiendo el legado de su clan en pos de conocer la verdad sobre el Siglo Vacío.`,
`Cumplir con la voluntad del anciano de Jikogisei, convirtiéndose en la última división que descubrirá la verdad y liberará al mundo, haciendo conocida y temida nuevamente a la organización.`,
`Colocar la bandera de Jikogisei en cada isla, como un guiño de que siguen vivos, pues mientras ellos sigan vivos, la verdad estará más cerca. Es su forma de demostrar su ira hacia el Gobierno.`,
`Cumplir con su tarea pendiente, sin volver a caer en la pereza: descubrir qué esconden las islas del cielo.`,
`No volver a perder a nadie más como pasó en su isla natal, es su mayor codicia. Antes que ver caer a un compañero preferiría caer el mismo.`]},
 {id:'preferencias', tipo:'sistema', nombre:'Sistema de preferencias', subtitulo:'Aficiones y gustos', pos:[.52,.48], mpos:[.62,.84],
  con:[[-11,-3],[-5,8],[9,7],[12,-5]],
  texto:[
`Comida favorita: Cualquier cosa con mayonesa`,
`Color favorito: Azul noche`,
`Aficiones:`,
`Observar las estrellas, intentando encontrar constelaciones nuevas o inventándoselas cuando se aburre.`,
`Descifrar textos por puro vicio, hasta el punto de olvidarse de comer o dormir por una inscripción que probablemente no lleve a ninguna parte.`,
`Buscar lugares altos para echarse la siesta, porque considera que dormir con buenas vistas es aprovechar mejor el tiempo.`,
`Poner nombres a las estrellas según sus compañeros, aunque rara vez sean nombres precisamente halagadores.`,
`Tumbarse a escuchar conversaciones ajenas en las tabernas, fingiendo que está dormido mientras memoriza cada rumor interesante que escucha.`]},
 {id:'desconocida', tipo:'desconocida', nombre:'Estrella desconocida', subtitulo:'Aún sin revelar', pos:[.80,.86], mpos:[.38,.93],
  con:[[-7,-6],[6,-8]],
  texto:[`[Secreto aún sin revelar.]`]}
];

/* ================= CÓDIGO ================= */
const svg = document.getElementById('map');
const scrollEl = document.getElementById('scroll');
const veil = document.getElementById('veil');
const hint = document.getElementById('hint');
let activo = null, ultimoFoco = null, deco;

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function forma(tipo,s){
  const f=n=>n.toFixed(1);
  switch(tipo){
    case 'rigel': return forma('estrella',s)+`<g transform="rotate(45)">${forma('estrella',s*.62)}</g>`;
    case 'luna': return `<path class="core" d="M0,${-s} A${s},${s} 0 1,0 0,${s} A${f(s*.7)},${f(s*.7)} 0 1,1 0,${-s}Z"/>`;
    case 'planeta': case 'errante': return `<circle class="core" r="${f(s*.6)}"/><ellipse rx="${f(s*1.3)}" ry="${f(s*.32)}" fill="none" stroke="#ecd496" stroke-width="1.2" transform="rotate(-20)"/>${tipo==='errante'?`<line x1="${f(s*.5)}" y1="${f(-s*.3)}" x2="${f(s*3)}" y2="${f(-s*1.3)}" stroke="#ecd496" stroke-width="1" opacity=".6" stroke-dasharray="3 3"/>`:''}`;
    case 'sistema': return `<circle class="core" r="${f(s*.5)}"/><circle r="${f(s*1.2)}" fill="none" stroke="#c9a45c" stroke-width="1" stroke-dasharray="3 3"/><circle r="${f(s*1.9)}" fill="none" stroke="#c9a45c" stroke-width=".8" stroke-dasharray="2 5" opacity=".7"/><circle cx="${f(s*1.2)}" r="${f(s*.2)}" fill="#ecd496"/><circle cx="${f(-s*.8)}" cy="${f(s*1.4)}" r="${f(s*.25)}" fill="#ecd496"/>`;
    case 'desconocida': return `<circle class="core" r="${f(s*.7)}"/><circle r="${f(s*1.2)}" fill="none" stroke="#6b6f85" stroke-dasharray="2 4"/><text y="${f(s*.3)}" text-anchor="middle" font-family="Cinzel,serif" font-size="${f(s*.9)}" fill="#8a8fa8">?</text>`;
    default: return `<path class="core" d="M0,${-s}L${f(s*.22)},${f(-s*.22)}L${s},0L${f(s*.22)},${f(s*.22)}L0,${s}L${f(-s*.22)},${f(s*.22)}L${-s},0L${f(-s*.22)},${f(-s*.22)}Z"/>`;
  }
}
function tipoForma(t){return {rigel:'rigel',estrella:'estrella',luna:'luna',constelacion:'estrella',diario:'estrella',errante:'errante',sistema:'sistema',desconocida:'desconocida'}[t]}

function construir(){
  const W=innerWidth,H=innerHeight,u=Math.min(W,H)/100,vert=W<=700||H>W,cx=W/2,cy=H/2;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const r=rng(7);let s='';
  s+=`<defs><radialGradient id="glow"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".75"/><stop offset=".5" stop-color="#c9a45c" stop-opacity=".25"/><stop offset="1" stop-color="#c9a45c" stop-opacity="0"/></radialGradient>
  <radialGradient id="nebula"><stop offset="0" stop-color="#3a2c6a" stop-opacity=".35"/><stop offset="1" stop-color="#3a2c6a" stop-opacity="0"/></radialGradient></defs>`;
  // capa de fondo (se mueve con el cursor)
  s+=`<g id="deco" aria-hidden="true">`;
  s+=`<ellipse cx="${W*.3}" cy="${H*.35}" rx="${W*.3}" ry="${H*.25}" fill="url(#nebula)"/><ellipse cx="${W*.75}" cy="${H*.7}" rx="${W*.28}" ry="${H*.25}" fill="url(#nebula)"/>`;
  for(let i=0;i<(vert?160:260);i++){const x=r()*W,y=r()*H,rad=r()*1.3+.3;s+=`<circle class="star" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${rad.toFixed(1)}" fill="#efe3c2" style="animation-delay:${(r()*5).toFixed(1)}s;animation-duration:${(3+r()*4).toFixed(1)}s"/>`}
  const R=u*47;
  s+=`<g stroke="#c9a45c" fill="none">`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${R}" stroke-width="1.6" opacity=".7"/><circle cx="${cx}" cy="${cy}" r="${R*.94}" stroke-width=".7" opacity=".6"/>`;
  let ticks='';for(let i=0;i<120;i++){const a=i*Math.PI/60,l=i%10===0?R*.06:R*.03;ticks+=`M${(cx+Math.cos(a)*R*.94).toFixed(1)} ${(cy+Math.sin(a)*R*.94).toFixed(1)}L${(cx+Math.cos(a)*(R*.94-l)).toFixed(1)} ${(cy+Math.sin(a)*(R*.94-l)).toFixed(1)}`}
  s+=`<path d="${ticks}" stroke-width=".8" opacity=".6"/>`;
  s+=`<g class="orbit"><ellipse cx="${cx}" cy="${cy}" rx="${R*.75}" ry="${R*.4}" stroke-width=".8" stroke-dasharray="4 6" opacity=".5" transform="rotate(-18 ${cx} ${cy})"/><circle cx="${cx+R*.75}" cy="${cy}" r="3" fill="#ecd496" stroke="none"/></g>`;
  s+=`<g class="orbit rev"><circle cx="${cx}" cy="${cy}" r="${R*.55}" stroke-width=".8" stroke-dasharray="1 7" opacity=".6"/><circle cx="${cx}" cy="${cy-R*.55}" r="2.5" fill="#c9a45c" stroke="none"/></g>`;
  s+=`<ellipse cx="${cx}" cy="${cy}" rx="${R*.3}" ry="${R*.3}" stroke-width=".7" opacity=".4"/><path d="M${cx-R} ${cy}H${cx+R}M${cx} ${cy-R}V${cy+R}" stroke-width=".5" opacity=".3"/>`;
  s+=`</g></g>`;
  // constelaciones
  s+=`<g id="cons" aria-hidden="true">`;
  for(const a of ASTROS){
    const [px,py]=(vert?a.mpos:a.pos),x=px*W,y=py*H;
    const pts=[[0,0],...a.con].map(([dx,dy])=>[x+dx*u,y+dy*u]);
    let l='',d='';
    const ln=(q,p)=>`<line x1="${q[0].toFixed(1)}" y1="${q[1].toFixed(1)}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}"/>`;
    pts.forEach((p,i)=>{if(i>0){d+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${a.lineas?3:2.6}"/>`;if(!a.lineas)l+=ln(i===1?pts[0]:pts[i-1],p)}});
    if(a.lineas)a.lineas.forEach(([i,j])=>l+=ln(pts[i],pts[j]));
    if(a.constelacion)d+=`<text class="deco-t" x="${(x+8*u).toFixed(0)}" y="${(y+10*u).toFixed(0)}" text-anchor="middle" font-size="12" style="fill:#c9a45c;stroke:none">${a.constelacion}</text>`;
    s+=`<g class="con${a.id===activo?' lit':''}" data-con="${a.id}">${l}${d}</g>`;
  }
  s+=`</g>`;
  // decoración de esquinas
  const fs=vert?11:14;
  s+=`<g aria-hidden="true">
  <text class="deco-t" x="${vert?18:36}" y="${vert?38:56}" font-size="${vert?18:26}" font-weight="700">${ATLAS.titulo}</text>
  <text class="deco-m" x="${vert?18:36}" y="${vert?58:80}" font-size="${fs+2}">${ATLAS.autor}</text>
  <text class="deco-t" x="${vert?18:36}" y="${vert?76:100}" font-size="${fs-2}" opacity=".6">LAT 36°N · LONG 00°E</text>`;
  if(!vert) s+=`<text class="deco-m" x="36" y="${H-34}" font-size="17">${ATLAS.cita}</text>`;
  // brújula
  const bx=W-(vert?48:90),by=vert?58:96,br=vert?26:44;
  s+=`<g transform="translate(${bx} ${by})" stroke="#c9a45c" fill="none"><circle r="${br}" stroke-width="1.2"/><circle r="${br*.78}" stroke-width=".6" stroke-dasharray="2 3"/>
  <path d="M0 ${-br*1.15}L${br*.14} 0L0 ${br*1.15}L${-br*.14} 0Z" fill="#8c3a3a" fill-opacity=".55" stroke-width="1"/><path d="M${-br*1.15} 0L0 ${-br*.14}L${br*1.15} 0L0 ${br*.14}Z" fill="#c9a45c" fill-opacity=".25" stroke-width="1"/>
  <text class="deco-t" y="${-br*1.3}" text-anchor="middle" font-size="12" stroke="none">N</text></g>`;
  s+=`</g>`;
  // astros interactivos
  s+=`<g id="astros">`;
  for(const a of ASTROS){
    const [px,py]=(vert?a.mpos:a.pos),x=px*W,y=py*H,sz=a.size?(vert?a.size*.75:a.size):(vert?12:15),right=px<.7;
    s+=`<g class="astro${a.tipo==='desconocida'?' unk':''}${a.tipo==='rigel'?' rigel':''}${a.id===activo?' active':''}" data-id="${a.id}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" tabindex="0" role="button" aria-label="${a.nombre}: ${a.subtitulo}">
      <circle class="halo" r="${sz*2.4}" fill="url(#glow)" ${a.tipo==='desconocida'?'opacity=".3"':''} pointer-events="none"/>
      ${forma(tipoForma(a.tipo),sz)}
      <circle class="ring" r="${sz*1.9}" stroke-dasharray="3 4"/>
      <circle r="${vert?30:28}" fill="transparent"/>
      <text class="lbl" x="${right?sz*2.3:-sz*2.3}" y="4" text-anchor="${right?'start':'end'}">${a.nombre.toUpperCase()}</text>
    </g>`;
  }
  s+=`</g>`;
  svg.innerHTML=s;deco=document.getElementById('deco');
}

function abrir(id){
  const a=ASTROS.find(z=>z.id===id);if(!a)return;
  activo=id;
  document.getElementById('sTitle').textContent=a.nombre;
  document.getElementById('sSub').textContent=a.subtitulo;
  const llenar=(dl,lista)=>{dl.innerHTML='';lista.forEach(x=>{const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=x.t;
    if(Array.isArray(x.v)){const ul=document.createElement('ul');x.v.forEach(i=>{const li=document.createElement('li');li.textContent=i;ul.append(li)});dd.append(ul)}else dd.textContent=x.v;dl.append(dt,dd)})};
  const cuerpo=document.getElementById('sBody');cuerpo.innerHTML='';a.texto.forEach(t=>{const p=document.createElement('p');p.textContent=t;cuerpo.append(p)});
  const top=document.getElementById('sTop'),pic=document.getElementById('sPic');
  top.hidden=!a.ficha;
  if(a.ficha){llenar(document.getElementById('sFicha'),a.ficha);pic.innerHTML='';
    if(a.imagen){const im=new Image();im.alt='Retrato de '+a.ficha[0].v;im.onerror=()=>{pic.innerHTML='<span>No se pudo cargar la imagen</span>'};im.src=a.imagen;pic.append(im)}
    else pic.innerHTML='<span>Retrato<br><small>enlace en <code>imagen</code></small></span>'}
  const px=a.pos[0];
  scrollEl.classList.toggle('left',px>.5);scrollEl.classList.toggle('right',px<=.5);
  scrollEl.scrollTop=0;scrollEl.classList.add('open');scrollEl.setAttribute('aria-hidden','false');veil.classList.add('on');
  hint.classList.add('off');
  marcar();
  setTimeout(()=>document.getElementById('close').focus({preventScroll:true}),50);
}
function cerrar(){
  if(!activo)return;
  scrollEl.classList.remove('open');scrollEl.setAttribute('aria-hidden','true');veil.classList.remove('on');
  const id=activo;activo=null;marcar();
  const el=svg.querySelector(`.astro[data-id="${id}"]`);if(el)el.focus({preventScroll:true});
}
function marcar(){
  svg.querySelectorAll('.astro').forEach(e=>e.classList.toggle('active',e.dataset.id===activo));
  svg.querySelectorAll('.con').forEach(e=>e.classList.toggle('lit',e.dataset.con===activo));
}

svg.addEventListener('click',e=>{const t=e.target.closest('.astro');if(t)abrir(t.dataset.id)});
svg.addEventListener('keydown',e=>{const t=e.target.closest('.astro');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();abrir(t.dataset.id)}});
document.getElementById('close').addEventListener('click',cerrar);
veil.addEventListener('click',cerrar);
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrar()});

// Parallax muy sutil (solo capa decorativa, no afecta a los clics)
const calma=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!calma)addEventListener('pointermove',e=>{if(e.pointerType==='touch'||!deco)return;
  deco.style.transform=`translate(${((e.clientX/innerWidth-.5)*-14).toFixed(1)}px,${((e.clientY/innerHeight-.5)*-14).toFixed(1)}px)`});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(construir,120)});
construir();
setTimeout(()=>hint.classList.add('off'),9000);
</script>
</body>
</html>
